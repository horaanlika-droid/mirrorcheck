<!doctype html>
<!-- Единственная тема — тёмная: палитра объявлена безусловно в слоях
     style/reference/ios, переключателя тем нет, цвет хрома задан в разметке,
     чтобы первая отрисовка сразу шла по графиту без мигания. -->
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080d11" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PRICELEX — агентство криптоброкеров</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/devices.js"></script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/reference.css" />
  <link rel="stylesheet" href="/ios.css" />
  <link rel="stylesheet" href="/devices.css" />
  <link rel="stylesheet" href="/fix.css" />
  <link rel="stylesheet" href="/glass.css" />
  <link rel="preload" as="image" href="/img/logo-full.png" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-img"></div>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-veil"></div>
  </div>

  <!-- Прелоадер: без «бегущих» анимаций — только большое лого и полный текст.
       Единственное движение — мягкое появление и растворение при готовности. -->
  <div id="preloader" class="preloader" role="status" aria-live="polite" aria-label="PRICELEX">
    <div class="preloader-inner">
      <img class="preloader-wordmark" src="/img/logo-full.png" alt="PRICELEX — Since 2025" width="1200" height="561" fetchpriority="high" />
      <div class="preloader-tag">Private Crypto Brokerage</div>
    </div>
  </div>

  <div class="app">
    <header class="hdr" id="appHeader" aria-label="PRICELEX"></header>

    <div class="announce hidden" id="announce"></div>

    <div class="syncbar hidden" id="syncStatus" role="status" aria-live="polite"></div>

    <main id="main">
      <section id="view-exchange" class="view"></section>
      <section id="view-profile" class="view hidden"></section>
      <section id="view-desk" class="view hidden"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-reviews" class="view hidden"></section>
      <section id="view-refs" class="view hidden"></section>
      <section id="view-broker" class="view hidden"></section>
      <section id="view-support" class="view hidden"></section>
      <section id="view-info" class="view hidden"></section>
    </main>

    <nav class="nav" id="nav"></nav>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
