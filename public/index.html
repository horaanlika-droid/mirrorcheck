<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e6eef5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>PRICELEX — BTC &amp; GRAM Exchange</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <header class="hdr">
      <div class="hdr-star">✦</div>
      <div class="hdr-logo">PRICELEX</div>
      <div class="hdr-sub">PRIVATE · BTC &amp; GRAM EXCHANGE</div>
      <div class="hdr-status" id="hdrStatus"></div>
    </header>

    <div class="announce" id="announce"></div>

    <div class="announce hidden" id="syncStatus" role="status" aria-live="polite"></div>

    <main id="main">
      <section id="view-exchange" class="view"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-refs" class="view hidden"></section>
      <section id="view-support" class="view hidden"></section>
      <section id="view-info" class="view hidden"></section>
    </main>

    <nav class="nav" id="nav"></nav>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
