<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PRICELEX — агентство криптоброкеров</title>
  <link rel="preload" as="image" href="/img/monolith.jpg" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="glowline"></span>
  </div>

  <div class="app">
    <header class="hdr">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div class="brand-text">
          <div class="hdr-logo">PRICELEX</div>
          <div class="hdr-sub">PRIVATE CRYPTO BROKERAGE</div>
        </div>
      </div>
      <div class="hdr-status" id="hdrStatus"></div>
    </header>

    <div class="announce hidden" id="announce"></div>

    <div class="syncbar hidden" id="syncStatus" role="status" aria-live="polite"></div>

    <main id="main">
      <section id="view-exchange" class="view"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-reviews" class="view hidden"></section>
      <section id="view-refs" class="view hidden"></section>
      <section id="view-support" class="view hidden"></section>
      <section id="view-info" class="view hidden"></section>
    </main>

    <nav class="nav" id="nav"></nav>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
