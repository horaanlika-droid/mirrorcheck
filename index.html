<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Зеркало</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="mirror-app">
      <header class="mirror-banner">
        <p>вот так работает зеркало</p>
      </header>

      <main class="mirror-surface" aria-label="Зеркало тестовой страницы">
        <div class="empty-state" id="emptyState">
          <div class="empty-state__mark" aria-hidden="true">↗</div>
          <h1>Зеркало готово</h1>
          <p>Отправьте боту команду <code>/mirror ссылка</code>, чтобы открыть тестовую страницу.</p>
        </div>

        <iframe
          class="mirror-frame"
          id="mirrorFrame"
          title="Тестовая страница в зеркале"
          sandbox="allow-forms allow-modals allow-popups allow-scripts"
          hidden
        ></iframe>

        <div class="mirror-status" id="mirrorStatus" role="status" aria-live="polite" hidden>
          <span class="mirror-status__dot" aria-hidden="true"></span>
          <span id="mirrorStatusText"></span>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
